<body>

<div class="app">

  <input type="file" id="fileInput" accept="audio/*" multiple hidden>

  <div class="topbar">
    <button id="addBtn" class="icon-btn" title="Agregar canciones">＋</button>
    <span id="songCount" class="song-count"></span>
  </div>

  <div class="cover">
    <svg viewBox="0 0 24 24" width="90" height="90" fill="white">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
  </div>

  <div class="track-info">
    <h2 id="songTitle">Agregá tus canciones</h2>
    <p id="songArtist"></p>
  </div>

  <div class="mode-row">
    <button id="shuffleBtn" class="icon-btn small" title="Aleatorio">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14.83 13.41l1.41-1.41L20.66 16.4 16.24 20.83l-1.41-1.41L17.41 17H14v-2h3.41zM3 6h5.86l6 12H21v-2h-4.86l-6-12H3z"/></svg>
    </button>
    <button id="repeatBtn" class="icon-btn small" title="Repetir">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>

  <div class="progress-row">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  </div>
  <div class="time-row">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button id="prevBtn" class="icon-btn big" title="Anterior">
      <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button id="playBtn" class="play-btn" title="Reproducir">
      <svg id="playIcon" viewBox="0 0 24 24" width="34" height="34"><path fill="white" d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="nextBtn" class="icon-btn big" title="Siguiente">
      <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </div>

  <ul id="playlist" class="playlist"></ul>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>
</body>
</html>
